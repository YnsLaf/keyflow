<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="KeyFlow – typing trainer for your terminal, made by YnsLaf">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50dcff"/>
      <stop offset="0.35" stop-color="#8a7dff"/>
      <stop offset="0.65" stop-color="#ff6fb5"/>
      <stop offset="1" stop-color="#ffb86b"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0; 300 0; -300 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50dcff"/>
      <stop offset="0.5" stop-color="#8a7dff"/>
      <stop offset="1" stop-color="#ff6fb5"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="22" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="22" fill="none" stroke="#30363d"/>

  <!-- Fenster-Punkte wie im Mac-Terminal -->
  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="26" r="6" fill="#febc2e"/>
  <circle cx="68" cy="26" r="6" fill="#28c840"/>

  <!-- Titel -->
  <text x="60" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="14" fill="url(#title)">KEYFLOW</text>
  <text x="62" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#c9d1d9">typing trainer for your terminal</text>
  <text x="62" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b949e">made by <tspan fill="#ff6fb5" font-weight="700">YnsLaf</tspan>  ·  English &amp; Deutsch</text>

  <!-- Fortschrittslinie -->
  <rect x="62" y="206" width="420" height="4" rx="2" fill="#30363d"/>
  <rect x="62" y="206" width="0" height="4" rx="2" fill="url(#line)">
    <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.7;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- kleine Tastatur, eine Taste leuchtet nach der anderen -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <g fill="#6e7681">
      <text x="560" y="120">Q</text><text x="584" y="120">W</text><text x="608" y="120">E</text><text x="632" y="120">R</text><text x="656" y="120">T</text><text x="680" y="120">Y</text>
      <text x="570" y="146">A</text><text x="594" y="146">S</text><text x="618" y="146">D</text><text x="642" y="146" fill="#c9d1d9" text-decoration="underline">F</text><text x="666" y="146">G</text><text x="690" y="146">H</text>
      <text x="580" y="172">Z</text><text x="604" y="172">X</text><text x="628" y="172">C</text><text x="652" y="172">V</text><text x="676" y="172">B</text><text x="700" y="172">N</text>
    </g>
    <text x="608" y="120" fill="#50dcff" font-weight="700" opacity="0">E<animate attributeName="opacity" values="0;1;0;0;0;0" dur="3s" repeatCount="indefinite"/></text>
    <text x="642" y="146" fill="#8a7dff" font-weight="700" opacity="0">F<animate attributeName="opacity" values="0;0;1;0;0;0" dur="3s" repeatCount="indefinite"/></text>
    <text x="700" y="172" fill="#ff6fb5" font-weight="700" opacity="0">N<animate attributeName="opacity" values="0;0;0;1;0;0" dur="3s" repeatCount="indefinite"/></text>
    <text x="656" y="120" fill="#ffb86b" font-weight="700" opacity="0">T<animate attributeName="opacity" values="0;0;0;0;1;0" dur="3s" repeatCount="indefinite"/></text>
    <rect x="590" y="186" width="90" height="3" rx="1.5" fill="#30363d"/>
  </g>

  <!-- Flow, das Maskottchen -->
  <g transform="translate(770 80)">
    <animateTransform attributeName="transform" type="translate" values="770 80; 770 74; 770 80" dur="2.4s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="76" height="66" rx="10" fill="#161b22" stroke="#ff6fb5" stroke-width="3"/>
    <ellipse cx="24" cy="26" rx="6" ry="6" fill="#ffffff">
      <animate attributeName="ry" values="6;6;0.6;6" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="52" cy="26" rx="6" ry="6" fill="#ffffff">
      <animate attributeName="ry" values="6;6;0.6;6" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M30 44 Q38 52 46 44" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="66" x2="22" y2="88" stroke="#ff6fb5" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="66" x2="54" y2="88" stroke="#ff6fb5" stroke-width="3" stroke-linecap="round"/>
    <text x="38" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle">Flow</text>
  </g>
</svg>
