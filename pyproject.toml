[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyflow"
version = "1.3.0"
description = "KeyFlow – Tipptrainer für das Terminal: WPM, freier Modus, Zahlen, Sonderzeichen, Rekorde und Aktivitätskalender"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["colorama>=0.4.6"]

[project.scripts]
keyflow = "keyflow.app:main"

[tool.setuptools]
packages = ["keyflow"]
